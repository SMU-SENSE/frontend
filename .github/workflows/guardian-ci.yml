name: Guardian CI

on:
  push:
    branches:
      - feature/dongseok
    paths:
      - 'guardian/**'
      - '.github/workflows/guardian-ci.yml'
  pull_request:
    paths:
      - 'guardian/**'
      - '.github/workflows/guardian-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guardian/package-lock.json
      - run: npm ci
      - run: npm run build
